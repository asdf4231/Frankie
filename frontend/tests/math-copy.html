<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Math-copy regression tests</title></head>
<body>
  <h1>Math-copy regression tests</h1>
  <pre id="results">Running…</pre>
  <script type="module" src="./math-copy.browser.tsx"></script>
  <script type="module">
    // This page is also useful for inspecting failures manually with pnpm dev.
    const wait = () => window.__mathCopyResults
      ? window.__mathCopyResults.then(results => {
          document.getElementById('results').textContent = JSON.stringify(results, null, 2)
          window.__mathCopyNative('mixed')
        })
      : requestAnimationFrame(wait)
    wait()
  </script>
</body>
</html>
