[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "frankie"
version = "0.1.0"
description = "Frankie - 厦门大学课程辅助系统"
requires-python = ">=3.14,<3.15"
dependencies = [
    # Native DeepSeek Chat Completions and structured tool calls
    "openai>=2.0.0",
    # Obsidian / Markdown
    "markdown-it-py>=3.0.0",
    "python-frontmatter>=1.1.0",
    # CLI
    "click>=8.1.0",
    "rich>=13.7.0",
    "prompt-toolkit>=3.0.0",
    # Config
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    # Utilities
    "httpx>=0.27.0",
    "anyio>=4.4.0",
    # Chat attachments
    "pypdf>=5.0.0",
    "python-docx>=1.1.0",
    "python-pptx>=1.0.0",
]

[project.scripts]
frankie = "frankie.cli:main"
frankie-smoke = "frankie.cli:smoke"
frankie-web = "frankie.cli:web"

[project.optional-dependencies]
web = [
    # Web 后端
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    # 静态文件托管
    "aiofiles>=23.2.0",
    "python-multipart>=0.0.18",
]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/frankie"]

# 部署服务器与本地都在国内：上游 PyPI 文件站从服务器实测约 27 KB/s，
# 镜像可到 MB/s 量级（见 README「运行环境一致性」）。这里选清华 TUNA：
# 同步及时，实测约 2.3 MB/s；阿里云镜像更快但索引滞后（会退回旧版本）。
[[tool.uv.index]]
name = "tuna"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.14"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v -s"
